{% extends "base.html" %}
{% block title %}Link not found — Makrotik Share{% endblock %}

{% block content %}
<section class="section state-page">
  <div class="state-icon">
    <svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
      <circle cx="11" cy="11" r="8.5" />
      <path d="M11 7.5v4.5M11 15v.5" />

  <h1 class="page-title"><strong>Link not found</strong></h1>
